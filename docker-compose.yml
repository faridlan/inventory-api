services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api-container
    ports:
     - "8081:8080"
    env_file:
      - .env
    depends_on:
      db-inventory:
        condition: service_healthy
    restart: always
    networks:
      - inventory-network

  db-inventory:
    image: postgres:15-alpine
    container_name: inventory-db-stag
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" 
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - inventory-network

volumes:
  inventory-data:

networks:
  inventory-network:
    driver: bridge